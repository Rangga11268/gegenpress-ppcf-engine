<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Tactical Background Gradient -->
    <linearGradient id="pitchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120d" />
      <stop offset="50%" stop-color="#0a1a14" />
      <stop offset="100%" stop-color="#040b08" />
    </linearGradient>

    <!-- Attacking Pitch Control Gradient (Spearman Probability) -->
    <radialGradient id="ppcfGlow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.0" />
    </radialGradient>

    <!-- Velocity Ray Gradient -->
    <linearGradient id="velocityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect width="512" height="512" rx="96" fill="url(#pitchBg)" stroke="#1e293b" stroke-width="4" />

  <!-- Tactical Football Pitch Markings (105m x 68m Grid Silhouette) -->
  <rect x="72" y="106" width="368" height="300" rx="8" fill="none" stroke="#1b382b" stroke-width="3" />
  <line x1="256" y1="106" x2="256" y2="406" stroke="#1b382b" stroke-width="3" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#1b382b" stroke-width="3" />
  <circle cx="256" cy="256" r="4" fill="#1b382b" />

  <!-- Penalty Box Left & Right -->
  <rect x="72" y="176" width="60" height="160" fill="none" stroke="#1b382b" stroke-width="2.5" />
  <rect x="380" y="176" width="60" height="160" fill="none" stroke="#1b382b" stroke-width="2.5" />

  <!-- Continuous PPCF Control Probability Field Iso-Surfaces (Heatmap) -->
  <circle cx="320" cy="230" r="110" fill="url(#ppcfGlow)" />
  <path d="M 230 190 Q 320 150 390 220 Q 370 330 270 310 Q 210 270 230 190 Z" 
        fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="6 4" opacity="0.8" />

  <!-- Ball Position -->
  <circle cx="300" cy="240" r="10" fill="#f8fafc" stroke="#0b0f19" stroke-width="2.5" />

  <!-- Attacking Player with Kinematic Velocity Vector (Dr. William Spearman Model) -->
  <circle cx="260" cy="270" r="14" fill="#38bdf8" stroke="#0b0f19" stroke-width="2" />
  <line x1="260" y1="270" x2="310" y2="225" stroke="url(#velocityGrad)" stroke-width="4" stroke-linecap="round" />
  <polygon points="314 220, 312 230, 302 225" fill="#10b981" />

  <!-- Defending Pressing Player (Gegenpress Closure Angle) -->
  <circle cx="350" cy="210" r="14" fill="#ef4444" stroke="#0b0f19" stroke-width="2" />
  <line x1="350" y1="210" x2="312" y2="232" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="4 3" stroke-linecap="round" />

  <!-- Offside Voronoi Seam Line -->
  <line x1="370" y1="106" x2="370" y2="406" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 6" opacity="0.7" />
</svg>
